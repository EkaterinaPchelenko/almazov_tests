{% extends "base.html" %}
{% load static %}

{% block title %}Пароль изменён | Medical Cell Trainer{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<section class="auth-page--single">
  <div class="auth-reset-card">
    <div class="auth-reset-head">
      <div class="auth-reset-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M8 12l3 3 5-6"></path>
        </svg>
      </div>

      <h1 class="auth-reset-title">Пароль изменён</h1>
      <p class="auth-reset-subtitle">
        Теперь вы можете войти в систему, используя новый пароль.
      </p>
    </div>

    <a class="auth-reset-btn" href="{% url 'login' %}">
      Перейти ко входу
    </a>
  </div>
</section>
{% endblock %}
