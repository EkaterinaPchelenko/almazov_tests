<div class="mb-6">
  <div class="flex justify-between text-sm mb-2">
    <span>Question {{ current }} of {{ total }}</span>
    <span>{{ percent }}%</span>
  </div>
  <div class="w-full bg-slate-200 rounded-full h-2">
    <div class="bg-blue-600 h-2 rounded-full" style="width: {{ percent }}%"></div>
  </div>
</div>

<div class="grid md:grid-cols-2 gap-8">
  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="font-semibold mb-4">Microscope Image</h2>
    <img src="{{ image.image.url }}" class="rounded-lg w-full" />
  </div>

  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="font-semibold mb-4">Identify the cell type</h2>

    <form
      data-hx-post="{% url 'submit_answer' %}"
      data-hx-target="#test-container"
      data-hx-swap="innerHTML"
    >
      {% csrf_token %}
      <input type="hidden" name="image_id" value="{{ image.id }}" />

      <input
        type="text"
        name="answer"
        placeholder="Enter cell name"
        class="w-full border rounded-lg px-4 py-2 mb-4 focus:ring-2 focus:ring-blue-500 outline-none"
        autocomplete="off"
      />

      <button class="w-full bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700 transition">
        Submit Answer
      </button>
    </form>
  </div>
</div>
