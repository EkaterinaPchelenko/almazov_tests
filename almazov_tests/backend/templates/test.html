{% extends "base.html" %}
{% block content %}
<div>
    <h2>Определите клетку</h2>
    <p>{{ order_number }} / {{ total }}</p>
    <progress value="{{ percent }}" max="100"></progress>

    <img src="{{ image.image.url }}" alt="Cell image" style="max-width: 400px;">

    <form method="post" action="{% url 'submit_answer' session.id %}">
        {% csrf_token %}
        <input type="text" name="answer" placeholder="Введите название клетки">
        <button type="submit">Ответить</button>
    </form>
</div>
{% endblock %}
