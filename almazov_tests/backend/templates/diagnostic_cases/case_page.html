{% extends "base.html" %}

{% block title %}Диагностический кейс | Medical Cell Trainer{% endblock %}

{% block content %}
<section class="card card--soft" style="padding: 28px; margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; gap: 20px; align-items: start; flex-wrap: wrap;">
        <div>
            <h1 class="section-title" style="font-size: 34px;">Диагностический кейс</h1>
            <p class="section-text" style="margin-top: 8px;">
                Определите типы клеток на изображениях, а после завершения кейса выберите диагноз.
            </p>
        </div>

        <div
            id="diagnostic-timer"
            data-started-at="{{ session.started_at|date:'c' }}"
            style="font-size: 22px; font-weight: 700;"
        >
            00:00
        </div>

        <a href="{% url 'levels_page' %}" class="btn btn-secondary">
            ← К уровням
        </a>
    </div>
</section>

<div
    id="diagnostic-case-content"
    hx-get="{% url 'diagnostic_case_batch_partial' session.id %}"
    hx-trigger="load"
    hx-swap="innerHTML"
>
    <div class="card card--soft" style="padding: 28px;">
        Загрузка кейса...
    </div>
</div>

<script>
(function () {
    const timer = document.getElementById("diagnostic-timer");
    if (!timer) return;

    const startedAt = new Date(timer.dataset.startedAt);

    function pad(value) {
        return String(value).padStart(2, "0");
    }

    function renderTimer() {
        const now = new Date();
        const diffSeconds = Math.max(Math.floor((now - startedAt) / 1000), 0);

        const hours = Math.floor(diffSeconds / 3600);
        const minutes = Math.floor((diffSeconds % 3600) / 60);
        const seconds = diffSeconds % 60;

        timer.textContent = hours > 0
            ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`
            : `${pad(minutes)}:${pad(seconds)}`;
    }

    renderTimer();
    setInterval(renderTimer, 1000);
})();
</script>
{% endblock %}Я
