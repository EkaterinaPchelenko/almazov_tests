<div id="diagnostic-case-container">
  <div class="case-progress">
    <div class="case-progress__text">
      Изображения {{ from_number }}–{{ to_number }} из {{ total_images }}
    </div>

    <div class="case-progress__bar">
      <div class="case-progress__fill" style="width: {{ progress_percent }}%;"></div>
    </div>
  </div>

  <form
    id="case-batch-form"
    hx-post="{% url 'submit_diagnostic_case_batch' session.id %}"
    hx-target="#diagnostic-case-container"
    hx-swap="outerHTML"
  >
    {% csrf_token %}

    <div class="case-batch-grid">
      {% for image in batch_images %}
        <div class="case-image-card">
          <img src="{{ image.image.url }}" alt="Клетка {{ image.order_number }}">

          <select
            class="case-cell-select"
            data-case-image-id="{{ image.id }}"
            required
          >
            <option value="">Выберите клетку</option>

            {% for cell in cell_options %}
              <option value="{{ cell.id }}">{{ cell.name }}</option>
            {% endfor %}
          </select>
        </div>
      {% endfor %}
    </div>

    <input type="hidden" name="answer" id="case-batch-answer">

    <button type="submit" class="btn btn--primary">
      Подтвердить 5 изображений
    </button>
  </form>
</div>

<style>
  .case-progress {
    margin-bottom: 24px;
  }

  .case-progress__text {
    margin-bottom: 8px;
    font-weight: 700;
  }

  .case-progress__bar {
    height: 10px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
  }

  .case-progress__fill {
    height: 100%;
    background: #2563eb;
  }

  .case-batch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }

  .case-image-card {
    padding: 14px;
    border: 1px solid #dbe4ef;
    border-radius: 18px;
    background: #ffffff;
  }

  .case-image-card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    border-radius: 12px;
    margin-bottom: 12px;
    background: #f8fafc;
  }

  .case-cell-select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
  }
</style>

<script>
  document.body.addEventListener("htmx:configRequest", function (event) {
    const form = event.target;

    if (!form || form.id !== "case-batch-form") {
      return;
    }

    const result = {};

    document.querySelectorAll(".case-cell-select").forEach((select) => {
      result[select.dataset.caseImageId] = select.value;
    });

    event.detail.parameters["answer"] = JSON.stringify(result);

    const input = document.getElementById("case-batch-answer");
    if (input) {
      input.value = JSON.stringify(result);
    }
  });
</script>
