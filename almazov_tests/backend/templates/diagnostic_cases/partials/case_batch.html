<div class="card card--soft" style="padding: 28px;">
    <div style="display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px;">
        <div>
            <h2 class="section-title" style="font-size: 26px; margin-bottom: 6px;">
                Диагностический кейс
            </h2>
            <p class="section-text">
                Изображения {{ from_number }}–{{ to_number }} из {{ total_images }}
            </p>
        </div>

        <div style="min-width: 180px;">
            <div style="font-size: 13px; opacity: .75; margin-bottom: 6px;">
                Прогресс: {{ progress_percent }}%
            </div>
            <div style="height: 10px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden;">
                <div style="height: 100%; width: {{ progress_percent }}%; border-radius: 999px; background: #58cc02;"></div>
            </div>
        </div>
    </div>

    {% if error_message %}
        <div class="card" style="padding: 14px 16px; margin-bottom: 18px; border: 1px solid rgba(255, 90, 90, .45); background: rgba(255, 90, 90, .08);">
            <strong>Проверь ответы:</strong> {{ error_message }}
        </div>
    {% endif %}

    <form
        hx-post="{% url 'submit_diagnostic_case_batch' session.id %}"
        hx-target="#diagnostic-case-content"
        hx-swap="innerHTML"
    >
        {% csrf_token %}

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;">
            {% for image in batch_images %}
                <div class="card" style="padding: 16px;">
                    <div style="aspect-ratio: 1 / 1; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.06); margin-bottom: 14px;">
                        <img
                            src="{{ image.image.url }}"
                            alt="Diagnostic case image {{ image.order_number }}"
                            style="width: 100%; height: 100%; object-fit: cover;"
                        >
                    </div>

                    <label for="cell-{{ image.id }}" style="display: block; font-weight: 700; margin-bottom: 8px;">
                        Выберите тип клетки
                    </label>

                    <select
                        id="cell-{{ image.id }}"
                        name="cell_{{ image.id }}"
                        required
                        style="width: 100%; padding: 12px 14px; border-radius: 14px;"
                    >
                        <option value="">Выберите клетку</option>
                        {% for cell in cell_options %}
                            <option value="{{ cell.id }}">
                                {{ cell.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            {% endfor %}
        </div>

        <div style="display: flex; justify-content: flex-end; margin-top: 22px;">
            <button type="submit" class="btn btn-primary">
                Подтвердить блок
            </button>
        </div>
    </form>
</div>
